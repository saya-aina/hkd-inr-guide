name: Alerts watchdog

# 12:00 UTC = 17:30 IST. Fails (and so emails the repo owner) if the daily
# alert workflow has not completed successfully in the last 12 hours.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for a recent successful alert run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Filter in jq: the API's status=success filter missed a real success on 24 Nov.
          # Count only real sends (run title "Send"), not dry runs.
          n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/send-alerts.yml/runs" -f per_page=30 -q "[.workflow_runs[] | select(.conclusion == \"success\" and .display_title == \"Send\" and .created_at >= \"${since}\")] | length")
          echo "successful alert runs in the last 12h: ${n}"
          if [ "${n}" -lt 1 ]; then
            echo "::error::Daily rate alert did not run successfully in the last 12 hours."
            exit 1
          fi
